<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPC Secret Hunter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              fantasy: ['Cinzel', 'serif'],
              sans: ['Noto Sans KR', 'sans-serif'],
              ui: ['Inter', 'sans-serif'],
            },
            colors: {
              dark: {
                900: '#0f172a', // Slate 900
                800: '#1e293b', // Slate 800
                700: '#334155', // Slate 700
                surface: '#0B0D12', // Almost black
              },
              gold: {
                400: '#fbbf24', // Amber 400
                500: '#f59e0b', // Amber 500
                600: '#d97706', // Amber 600
                glow: 'rgba(251, 191, 36, 0.2)',
              },
              mystic: {
                500: '#6366f1', // Indigo 500
                900: '#312e81', // Indigo 900
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'pulse-glow': 'pulseGlow 3s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 10px rgba(251, 191, 36, 0.1)' },
                '50%': { boxShadow: '0 0 25px rgba(251, 191, 36, 0.3)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #0B0D12;
        color: #e2e8f0;
      }
      /* Glassmorphism utilities */
      .glass {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-input {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
          width: 6px;
      }
      ::-webkit-scrollbar-track {
          background: transparent;
      }
      ::-webkit-scrollbar-thumb {
          background: #334155;
          border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
          background: #475569;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
